
name: Hollow Knight PSP Beta

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          echo "=== PROJETO ==="
          ls -la
          echo "=== CODIGO ==="
          ls -la src
          echo "=== IMAGEM DE FUNDO ==="
          if [ -f assets/background.jpg ]; then
            echo "JPG encontrado"
          else
            echo "JPG nao encontrado"
          fi

      - name: Compilar
        run: |
          make clean || true
          make

      - name: Publicar EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: hollow-knight-psp-beta
          path: EBOOT.PBP
          if-no-files-found: error
