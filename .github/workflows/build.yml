
name: Build PSP Menu

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          echo "=== RAIZ DO PROJETO ==="
          ls -la
          echo "=== PASTA SRC ==="
          ls -la src || true
          echo "=== LOCALIZAR MAIN.C ==="
          find . -iname 'main.c' -print

      - name: Compilar menu
        run: make

      - name: Enviar EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: hk-beta-menu
          path: EBOOT.PBP
