
name: Build Dark Bot

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Compilar Dark Bot
        run: |
          make clean
          make

      - name: Publicar EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: DarkBot-PSP
          path: EBOOT.PBP
          if-no-files-found: error
